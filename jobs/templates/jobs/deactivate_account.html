{% extends "main/base.html" %}
{% block title %}Deactivate Account{% endblock %}

{% block content %}
<div class="col-md-6 offset-md-3 mt-4">
  <div class="card shadow-lg border-0 rounded-3">
    <div class="card-body p-4 text-center">
      <h3 class="fw-bold mb-3 text-danger">Deactivate Your Account</h3>
      <p>Are you sure you want to deactivate your account? You won’t be able to log in until it is reactivated.</p>
      
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-warning btn-lg">Yes, Deactivate</button>
        <a href="{% url 'jobs:profile' %}" class="btn btn-secondary btn-lg">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
