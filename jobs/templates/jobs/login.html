{% extends "main/base.html" %}
{% block title %}Login | JobMate{% endblock %}

{% block content %}
<style>
  body {
    background: linear-gradient(135deg, #007bff 0%, #00c851 100%);
    background-size: 200% 200%;
    animation: gradientShift 8s ease infinite;
    font-family: "Poppins", sans-serif;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .login-wrapper {
    min-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
  }

  .login-card {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    padding: 45px 40px;
    width: 100%;
    max-width: 430px;
    text-align: center;
    animation: fadeInUp 0.8s ease;
    color: #fff;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .login-title {
    font-weight: 700;
    font-size: 1.8rem;
    color: #fff;
  }

  .welcome-text {
    font-size: 0.95rem;
    color: rgba(255, 255, 255, 0.85);
    margin-bottom: 25px;
  }

  .form-group {
    position: relative;
    margin-bottom: 25px;
  }

  .form-group input {
    width: 100%;
    padding: 14px 45px 14px 50px;
    font-size: 0.95rem;
    border-radius: 12px;
    border: 2px solid transparent;
    background: rgba(255, 255, 255, 0.95);
    color: #333;
    transition: all 0.3s ease;
  }

  .form-group input:focus {
    outline: none;
    border-color: #00b74a;
    box-shadow: 0 0 0 3px rgba(0, 183, 74, 0.15);
  }

  .form-group label {
    position: absolute;
    top: 50%;
    left: 50px;
    transform: translateY(-50%);
    color: #6c757d;
    font-size: 0.9rem;
    pointer-events: none;
    transition: 0.2s ease all;
  }

  .form-group input:focus + label,
  .form-group input:not(:placeholder-shown) + label {
    top: 5px;
    left: 45px;
    font-size: 0.75rem;
    color: #007bff;
    background: rgba(255, 255, 255, 0.9);
    padding: 0 6px;
    border-radius: 4px;
  }

  .input-icon {
    position: absolute;
    top: 50%;
    left: 18px;
    transform: translateY(-50%);
    color: #007bff;
    font-size: 1.1rem;
    transition: color 0.3s ease;
  }

  .form-group input:focus ~ .input-icon {
    color: #00b74a;
  }

  .toggle-password {
    position: absolute;
    top: 50%;
    right: 15px;
    transform: translateY(-50%);
    color: #6c757d;
    cursor: pointer;
    font-size: 1.25rem;
    transition: color 0.3s ease;
  }

  .toggle-password:hover {
    color: #007bff;
  }

  .btn-login {
    background: linear-gradient(90deg, #00c851, #007bff);
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-weight: 600;
    transition: all 0.3s ease;
  }

  .btn-login:hover {
    transform: scale(1.03);
    background: linear-gradient(90deg, #007bff, #00c851);
    box-shadow: 0 6px 16px rgba(0, 123, 255, 0.35);
  }

  .footer-links a {
    color: #fff;
    text-decoration: none;
  }

  .footer-links a:hover {
    text-decoration: underline;
  }

  /* ✅ Toast Styling */
  .toast-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1080;
  }

  .toast {
    border-radius: 12px;
    font-weight: 500;
    color: #fff;
  }

  .toast-success { background-color: #28a745; }
  .toast-error { background-color: #dc3545; }
  .toast-warning { background-color: #ffc107; color: #333; }
  .toast-info { background-color: #17a2b8; }
</style>

<div class="login-wrapper">
  <div class="login-card">
    <h3 class="login-title mb-2"><i class="bi bi-box-arrow-in-right me-2"></i>Login</h3>
    <p class="welcome-text">Welcome to <strong>JobMate</strong> — your gateway to opportunity 🚀</p>

    <form method="post" novalidate>
      {% csrf_token %}
      <div class="form-group">
        <input type="text" name="username" id="id_username" placeholder=" " required>
        <label for="id_username">Username</label>
        <i class="bi bi-person input-icon"></i>
      </div>

      <div class="form-group position-relative">
        <input type="password" name="password" id="id_password" placeholder=" " required>
        <label for="id_password">Password</label>
        <i class="bi bi-lock input-icon"></i>
        <i class="bi bi-eye toggle-password fs-4" id="togglePassword"></i>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-login text-white fw-semibold shadow-sm">
          <i class="bi bi-box-arrow-in-right me-1"></i> Login
        </button>
      </div>
    </form>

    <div class="footer-links mt-4">
      <p class="mb-1"><a href="{% url 'jobs:forgot_password' %}">Forgot password?</a></p>
      <p class="mb-0">Don’t have an account? <a href="{% url 'jobs:register' %}" class="fw-semibold">Register</a></p>
    </div>
  </div>
</div>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<script>
  // ✅ Password toggle
  const togglePassword = document.getElementById("togglePassword");
  const passwordField = document.getElementById("id_password");

  togglePassword.addEventListener("click", function () {
    const type = passwordField.getAttribute("type") === "password" ? "text" : "password";
    passwordField.setAttribute("type", type);
    this.classList.toggle("bi-eye");
    this.classList.toggle("bi-eye-slash");
  });

  // ✅ Auto fade Bootstrap toast
  document.addEventListener("DOMContentLoaded", function () {
    const toastElList = [].slice.call(document.querySelectorAll(".toast"));
    const toastList = toastElList.map(function (toastEl) {
      const toast = new bootstrap.Toast(toastEl, { delay: 3000 }); // 3 seconds
      toast.show();
      return toast;
    });
  });
</script>
{% endblock %}
