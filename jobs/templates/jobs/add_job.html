{% extends 'employer/base_employer.html' %}

{% load crispy_forms_tags %}
{% load static %}
{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow-lg border-0 rounded-3">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h3 class="mb-0">📝 Add New Job</h3>
                </div>

                <div class="card-body p-4">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form|crispy }}

                        <!-- Image Preview -->
                        <div class="mb-3 text-center">
                            <label for="{{ form.image.id_for_label }}" class="form-label fw-bold">
                                Job Image Preview
                            </label><br>
                            <img id="imagePreview"
                                src="{% static 'images/default-job.jpg' %}"
                                alt="Image Preview"
                                class="img-thumbnail mt-2"
                                style="max-width: 300px;">
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'employer:dashboard' %}" class="btn btn-outline-secondary px-4">⬅ Cancel</a>
                            <button type="submit" class="btn btn-success px-4">✅ Add Job</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
document.getElementById("id_image").addEventListener("change", function(event) {
    const [file] = event.target.files;
    if (file) {
        document.getElementById("imagePreview").src = URL.createObjectURL(file);
    }
});
</script>

{% endblock %}
