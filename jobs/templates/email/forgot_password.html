{% extends "main/base.html" %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<style>
  /* 🌟 Page Background - same gradient as your Login page */
  body {
    background: linear-gradient(135deg, #00b894 0%, #00a8ff 100%);
    font-family: 'Poppins', sans-serif;
    color: #fff;
  }

  /* 🌟 Centered card with glass effect */
  .forgot-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .forgot-card {
    background: rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    backdrop-filter: blur(12px);
    padding: 40px 35px;
    width: 100%;
    max-width: 450px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  }

  .forgot-card h3 {
    font-weight: 700;
    color: #fff;
  }

  .forgot-card p {
    color: #dcdcdc;
  }

  /* 🌟 Inputs */
  .forgot-card .form-control {
    background: rgba(255, 255, 255, 0.9);
    border: none;
    border-radius: 12px;
    padding: 12px 15px;
    font-size: 15px;
    color: #000;
    transition: 0.3s;
  }

  .forgot-card .form-control:focus {
    outline: none;
    box-shadow: 0 0 0 3px rgba(0, 200, 150, 0.4);
  }

  /* 🌟 Button */
  .forgot-card .btn-primary {
    background: linear-gradient(to right, #00c853, #0091ea);
    border: none;
    padding: 12px;
    border-radius: 12px;
    font-weight: 600;
    transition: 0.3s;
  }

  .forgot-card .btn-primary:hover {
    transform: scale(1.03);
    background: linear-gradient(to right, #00b04b, #007ed6);
  }

  /* 🌟 Back to Login link */
  .forgot-card a {
    color: #fff;
    text-decoration: none;
    transition: 0.3s;
  }

  .forgot-card a:hover {
    text-decoration: underline;
  }

  /* 🌟 Alerts */
  .alert {
    border-radius: 12px;
  }
</style>

<div class="forgot-container">
  <div class="forgot-card shadow-lg">
    <h3 class="text-center mb-3">Forgot Password</h3>
    <p class="text-center mb-4">Enter your email and we’ll send a reset link.</p>

    <!-- ✅ Messages -->
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3 text-start">
        <label for="email" class="form-label fw-semibold text-white">Email address</label>
        <input type="email" name="email" id="email" class="form-control" placeholder="Enter your email" required>
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-primary btn-lg">Send Reset Link</button>
      </div>
      <div class="text-center mt-3">
        <a href="{% url 'jobs:login' %}">← Back to Login</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
