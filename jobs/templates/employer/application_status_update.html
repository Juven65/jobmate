{% extends "employer/base_employer.html" %}
{% block title %}Update Status{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>📝 Update Status for {{ object.applicant.username }} ({{ object.job.title }})</h2>
    <hr>

    <form method="post" class="card p-4 shadow-sm">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">💾 Save</button>
        <a href="{% url 'employer:job_applications' object.job.id %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
