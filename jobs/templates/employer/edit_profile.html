{% extends "employer/base_employer.html" %}
{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="mt-5">
  <h2>Edit Profile</h2>
  <form method="post" enctype="multipart/form-data" class="card p-4 shadow-sm">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save Changes</button>
  </form>
</div>
{% endblock %}
