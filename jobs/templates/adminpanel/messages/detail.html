{% extends "adminpanel/base_admin.html" %}
{% block content %}
<div class="card shadow p-4">
    <h3 class="mb-3">{{ message.subject }}</h3>

    <p><strong>From:</strong> {{ message.sender.username }}</p>
    <p><strong>To:</strong> {{ message.receiver.username }}</p>

    <div class="border rounded p-3 my-3">
        {{ message.body|linebreaks }}
    </div>

    <p class="text-muted"><small>Sent: {{ message.timestamp|date:"M d, Y H:i" }}</small></p>

    <div class="mt-3">
        <a href="{% url 'adminpanel:inbox' %}" class="btn btn-secondary btn-sm">📥 Back to Inbox</a>
        <a href="{% url 'adminpanel:sent_messages' %}" class="btn btn-secondary btn-sm">📤 Back to Sent</a>
    </div>
</div>
{% endblock %}
